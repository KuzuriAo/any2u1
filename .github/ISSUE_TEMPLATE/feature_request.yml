name: Feature request
description: Something any2u1 should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then any idea for a solution.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Which browser do you use it in?
      options: [Chrome, Edge, Brave, Firefox, Another]
