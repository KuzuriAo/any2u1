name: Firefox
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The Firefox lint and the Firefox tests, in stock Firefox from Mozilla: the oldest release the extension supports
  # (its strict_min_version, an ESR) and the current release. Update the two versions when Mozilla ships new ones.
  firefox:
    runs-on: ubuntu-latest
    # A run takes a few minutes; a stall fails here instead of at the 6-hour job limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firefox: [153.7.0esr, 160.0.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The libraries Mozilla's Linux build loads, even headless. The runner's package mirror sometimes stalls. apt
      # retries a download that stops, and each try runs as root under one time limit, so a stalled apt-get is stopped
      # with it and frees the package lock for the next try.
      - run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          for attempt in 1 2 3; do
            sudo timeout -k 15s 5m sh -c 'apt-get update -q && apt-get install -y -q --no-install-recommends libgtk-3-0t64 libasound2t64 libx11-xcb1 libdbus-glib-1-2' && exit 0
            echo "Installing Firefox's system packages stalled or failed (try $attempt of 3)"
          done
          exit 1
        timeout-minutes: 17
      # Firefox from Mozilla's release archive, checked against the SHA-256 list published with the release.
      - env:
          VERSION: ${{ matrix.firefox }}
        run: |
          base="https://archive.mozilla.org/pub/firefox/releases/$VERSION"
          file="linux-x86_64/en-US/firefox-$VERSION.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "$base/SHA256SUMS"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/firefox.tar.xz" "$base/$file"
          expected=$(grep -F "  $file" "$RUNNER_TEMP/SHA256SUMS" | cut -d' ' -f1)
          test -n "$expected"
          echo "$expected  $RUNNER_TEMP/firefox.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/firefox"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP/firefox" --strip-components=1
          "$RUNNER_TEMP/firefox/firefox" --version
          echo "FIREFOX_BINARY=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - run: npm run lint:firefox
      - run: npm run test:firefox
